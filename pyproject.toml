[project]
name = "aegis"
version = "0.1.0"
description = "Authorized multi-agent web security assessment platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
testpaths = ["tests"]

[tool.setuptools]
packages = ["backend"]
